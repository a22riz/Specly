services:
  app:
    build: .
    restart: unless-stopped
    # Bound to localhost only: Cloudflare Tunnel (cloudflared) on this host
    # reaches it via http://localhost:3000; the internet never sees this port.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Generate with: openssl rand -hex 32
      - SPECLY_SECRET=${SPECLY_SECRET:?put SPECLY_SECRET in .env}
      - PRD_DB_PATH=/app/data/prd.sqlite
    volumes:
      - specly-data:/app/data
    healthcheck:
      # node:22 ships global fetch — no curl in the slim image.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  specly-data:
